<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕作品工坊 · Sub2API 原型</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#172033;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}.sidebar{background:#fff;border-right:1px solid #e8edf4;padding:24px 16px}.brand{font-weight:800;font-size:18px;padding:0 12px 28px}.nav{display:grid;gap:6px}.nav div{padding:11px 12px;border-radius:10px;color:#667085;font-size:14px}.nav .active{background:#eaf8f4;color:#07856e;font-weight:650}.main{padding:30px clamp(18px,3vw,46px);max-width:1500px;width:100%;margin:auto}.title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.title h1{font-size:24px;margin:0 0 6px}.muted{color:#758096;font-size:13px;line-height:1.6}.pill{border:1px solid #dbe3ec;background:white;color:#657086;border-radius:999px;padding:7px 12px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(290px,380px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid #e5eaf1;border-radius:16px;box-shadow:0 6px 22px #1b35540a}.panel-head{padding:18px 20px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:15px;margin:0}.panel-body{padding:20px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:12px;font-weight:650;color:#475467}.field input,.field textarea,.field select{width:100%;font:inherit;font-size:13px;color:#253047;border:1px solid #dce3ec;border-radius:9px;padding:10px 11px;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#16a58a;box-shadow:0 0 0 3px #16a58a1a}.field textarea{resize:vertical;min-height:112px;line-height:1.55}.hint{font-size:11px;color:#8b94a5;line-height:1.5}.actions{display:flex;gap:9px;align-items:center}.button{border:1px solid #dce3ec;border-radius:9px;padding:9px 13px;background:#fff;color:#46536a;font:inherit;font-size:12px;font-weight:650;cursor:pointer}.button.primary{background:#0c9b80;color:#fff;border-color:#0c9b80}.button.primary:hover{background:#087d68}.button:disabled{opacity:.55;cursor:wait}.result-panel{min-height:520px}.result-tabs{display:flex;gap:7px}.tab{padding:7px 11px;border:1px solid #e1e7ef;border-radius:8px;color:#707b8d;font-size:11px}.tab.on{background:#eaf8f4;color:#07856e;border-color:#b7e5d9}.preview{height:400px;width:100%;border:0;border-radius:10px;background:#f5f2e8}.empty{height:430px;display:grid;place-items:center;color:#9aa3b2;font-size:13px}.history{margin-top:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #edf0f5;font-size:12px;white-space:nowrap}th{color:#8a93a3;font-weight:600;background:#fafbfd}td{color:#475467}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf8f1;color:#0b8a65;font-size:10px}.status.wait{background:#fff5e8;color:#ad6a0c}.mask{font-family:ui-monospace,monospace;color:#7c8798}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#172033;color:white;border-radius:10px;box-shadow:0 8px 24px #0002;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.grid{grid-template-columns:1fr}.result-panel{min-height:420px}}@media(max-width:520px){.main{padding:20px 12px}.title h1{font-size:20px}.title{align-items:flex-start}.panel-body{padding:15px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand">◉ &nbsp;Sub2API</div><div class="nav"><div>仪表盘</div><div>用户管理</div><div>分组管理</div><div>渠道管理</div><div>渠道监控</div><div class="active">鹈鹕作品工坊</div><div>系统设置</div></div></aside>
  <main class="main">
    <header class="title"><div><h1>鹈鹕作品工坊</h1><div class="muted">管理员手动测试模型生成效果。输入上游地址、Key 和 Prompt，生成结果会进入临时历史。</div></div><span class="pill">管理员专用 · 历史保留 3 天</span></header>
    <div class="grid">
      <section class="panel"><div class="panel-head"><h2>新建测试</h2><span class="muted">不会修改渠道配置</span></div><div class="panel-body">
        <div class="field"><label for="url">上游 URL</label><input id="url" type="url" placeholder="https://api.example.com/v1" value="https://api.example.com/v1"></div>
        <div class="field"><label for="key">API Key</label><input id="key" type="password" placeholder="输入上游 API Key" autocomplete="off"><div class="hint">仅用于本次请求；历史仅显示脱敏 Key，不显示明文。</div></div>
        <div class="field"><label for="model">模型</label><select id="model"><option>gpt-6-astra</option><option>gpt-6.1-sol</option><option>自定义模型…</option></select></div>
        <div class="field"><label for="prompt">Prompt</label><textarea id="prompt">创建一个HTML，内容是SVG绘制一个鹈鹕骑自行车的2D动画</textarea></div>
        <div class="actions"><button id="run" class="button primary">▶ &nbsp;生成作品</button><span class="hint">生成可能需要几分钟</span></div>
      </div></section>
      <section class="panel result-panel"><div class="panel-head"><div><h2>作品预览</h2><div id="result-meta" class="muted" style="margin-top:4px">完成一次测试后显示结果</div></div><div class="result-tabs"><button class="button" id="preview-tab">查看作品</button><button class="button" id="source-tab">查看源码</button></div></div><div class="panel-body" id="output"><div class="empty">生成的作品会显示在这里</div></div></section>
    </div>
    <section class="panel history"><div class="panel-head"><div><h2>测试历史</h2><div class="muted" style="margin-top:4px">历史记录 3 天后自动删除</div></div><span class="pill">最近测试</span></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>模型</th><th>上游 URL</th><th>API Key</th><th>Prompt</th><th>状态</th><th>过期时间</th><th></th></tr></thead><tbody id="history"><tr><td colspan="8" class="muted" style="padding:24px;text-align:center">暂无测试记录</td></tr></tbody></table></div></section>
  </main>
</div><div class="toast" id="toast"></div>
<script>
let currentHtml=''; let currentRow=null; let showingSource=false; const history=[];
const $=id=>document.getElementById(id);function flash(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function mask(value){if(!value)return '—';return value.length<8?'••••':value.slice(0,4)+'••••'+value.slice(-3)}
function renderHistory(){const body=$('history');if(!history.length){body.innerHTML='<tr><td colspan="8" class="muted" style="padding:24px;text-align:center">暂无测试记录</td></tr>';return}body.innerHTML=history.map((r,i)=>`<tr><td>${r.time}</td><td>${r.model}</td><td title="${r.url}">${r.url}</td><td class="mask">${r.key}</td><td title="${r.prompt}">${r.prompt.slice(0,25)}${r.prompt.length>25?'…':''}</td><td><span class="status ${r.status==='生成中'?'wait':''}">${r.status}</span></td><td>${r.expires}</td><td><button class="button" onclick="showHistory(${i})">查看</button></td></tr>`).join('')}
function showHistory(i){const row=history[i];currentRow=row;currentHtml=row.html;showingSource=false;renderOutput();$('result-meta').textContent=`${row.model} · ${row.time} · ${row.status}`;window.scrollTo({top:0,behavior:'smooth'})}
function renderOutput(){const out=$('output');out.innerHTML='';if(!currentHtml){out.innerHTML='<div class="empty">生成的作品会显示在这里</div>';return}if(showingSource){const pre=document.createElement('pre');pre.style.cssText='height:400px;overflow:auto;white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:16px;border-radius:10px;font-size:12px';pre.textContent=currentHtml;out.appendChild(pre)}else{const frame=document.createElement('iframe');frame.className='preview';frame.setAttribute('sandbox','');frame.srcdoc=currentHtml;out.appendChild(frame)}}
$('preview-tab').onclick=()=>{showingSource=false;renderOutput()};$('source-tab').onclick=()=>{showingSource=true;renderOutput()};
$('run').onclick=()=>{const url=$('url').value.trim(),key=$('key').value.trim(),model=$('model').value,prompt=$('prompt').value.trim();if(!url||!key||!prompt){flash('请填写 URL、API Key 和 Prompt');return}const now=new Date(),expires=new Date(now.getTime()+3*86400000);const row={time:now.toLocaleString('zh-CN'),expires:expires.toLocaleString('zh-CN'),model,url,key:mask(key),prompt,status:'生成中',html:''};history.unshift(row);currentRow=row;renderHistory();$('run').disabled=true;$('run').textContent='正在生成…';$('result-meta').textContent=`${model} · 正在生成作品`;setTimeout(()=>{row.status='完成';row.html='<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body style="margin:0;background:#f4efe2;font:16px sans-serif;display:grid;place-items:center;height:100vh"><main style="text-align:center;color:#315b58"><h1>骑车的鹈鹕</h1><svg width="520" height="290" viewBox="0 0 520 290" xmlns="http://www.w3.org/2000/svg"><circle cx="145" cy="220" r="55" fill="none" stroke="#327e78" stroke-width="8"/><circle cx="375" cy="220" r="55" fill="none" stroke="#327e78" stroke-width="8"/><path d="M145 220l82-95 55 95h-137l95-35 78-25 57 60" fill="none" stroke="#327e78" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="230" cy="118" rx="43" ry="57" fill="#fffdf4" stroke="#315b58" stroke-width="5"/><circle cx="243" cy="105" r="6" fill="#243b3a"/><path d="M267 112q76-28 115 8-45 26-115 4" fill="#e6a94c" stroke="#9b6338" stroke-width="4"/><path d="M205 165q45 34 75 0m-37 25v31m72-107l-28 29m-65 117 36-4m124 0 32-4" fill="none" stroke="#315b58" stroke-width="8" stroke-linecap="round"/></svg><p>本原型仅展示后台布局与预览流程</p></main></body></html>';currentHtml=row.html;showingSource=false;renderHistory();renderOutput();$('result-meta').textContent=`${model} · ${row.time} · 作品已生成`;$('run').disabled=false;$('run').textContent='▶ 生成作品';$('key').value='';flash('原型演示：作品已生成，记录保留 3 天')},1200)};
</script>
</body></html>
